<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HammerX Document Loader</title>
    <style>
        :root {
            --bg-color: #121418;
            --card-bg: #1c2027;
            --accent-color: #00e5ff;
            --accent-hover: #00b4d8;
            --text-main: #f0f4f8;
            --text-dim: #94a3b8;
            --border-color: #2e3846;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .loader-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 520px;
            padding: 32px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            margin-bottom: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.6rem;
            color: var(--accent-color);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label.field-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            background-color: #151921;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: var(--accent-color);
        }

        .page-range {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .file-upload-box {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background-color: #151921;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            position: relative;
        }

        .file-upload-box:hover {
            border-color: var(--accent-color);
            background-color: #1a202c;
        }

        .file-upload-box input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-icon {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .file-text {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .selected-file-name {
            display: block;
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--accent-color);
            word-break: break-all;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            border: none;
            border-radius: 6px;
            color: #0b1118;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .submit-btn:hover {
            opacity: 0.95;
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        .submit-btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
            transform: none;
        }

        .status-container {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: none;
            line-height: 1.4;
        }

        .status-loading {
            display: block;
            background-color: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }

        .status-success {
            display: block;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        .status-error {
            display: block;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }
    </style>
</head>
<body>

    <div class="loader-card">
        <div class="header">
            <h1>HAMMER-X MILL</h1>
            <p>PDF Segmentation &amp; 9-Dimensional Feature Extractor</p>
        </div>

        <form id="millForm" onsubmit="handleMillSubmit(event)">
            <div class="form-group">
                <label class="field-label" for="projectName">Project Name</label>
                <input type="text" id="projectName" value="test_009" required>
            </div>

            <div class="form-group">
                <label class="field-label">Select Document (PDF)</label>
                <div class="file-upload-box">
                    <input type="file" id="pdfFileInput" accept="application/pdf" required onchange="handleFileChange(event)">
                    <div class="file-icon">&#128196;</div>
                    <div class="file-text">Click to choose PDF file</div>
                    <span id="fileNameDisplay" class="selected-file-name">No file selected</span>
                </div>
            </div>

            <div class="page-range">
                <div class="form-group">
                    <label class="field-label" for="startPage">Start Page</label>
                    <input type="number" id="startPage" value="30" min="1" required>
                </div>
                <div class="form-group">
                    <label class="field-label" for="endPage">End Page</label>
                    <input type="number" id="endPage" value="32" min="1" required>
                </div>
            </div>

            <button type="submit" id="millBtn" class="submit-btn">START MILLING</button>
        </form>

        <div id="statusBox" class="status-container"></div>
    </div>

    <script>
        const API_ENDPOINT = "https://freesegmill-py.onrender.com/api/mill";
        let selectedFile = null;

        function handleFileChange(event) {
            const file = event.target.files[0];
            const nameDisplay = document.getElementById("fileNameDisplay");
            if (file) {
                selectedFile = file;
                nameDisplay.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
            } else {
                selectedFile = null;
                nameDisplay.textContent = "No file selected";
            }
        }

        function setStatus(message, type) {
            const statusBox = document.getElementById("statusBox");
            statusBox.className = "status-container";
            if (!type) {
                statusBox.style.display = "none";
                return;
            }
            statusBox.classList.add(`status-${type}`);
            statusBox.innerHTML = message;
        }

        async function handleMillSubmit(event) {
            event.preventDefault();

            if (!selectedFile) {
                setStatus("Please select a valid PDF file first.", "error");
                return;
            }

            const projectName = document.getElementById("projectName").value.trim() || "Deck";
            const startPage = parseInt(document.getElementById("startPage").value, 10);
            const endPage = parseInt(document.getElementById("endPage").value, 10);
            const millBtn = document.getElementById("millBtn");

            if (startPage > endPage) {
                setStatus("Start Page cannot be greater than End Page.", "error");
                return;
            }

            const formData = new FormData();
            formData.append("file", selectedFile);
            formData.append("project_name", projectName);
            formData.append("start_page", startPage);
            formData.append("end_page", endPage);

            millBtn.disabled = true;
            setStatus(`<strong>Milling in Progress...</strong><br>Processing pages ${startPage} to ${endPage}. Sending payload to cloud refinery...`, "loading");

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server returned HTTP ${response.status}: ${response.statusText}`);
                }

                const manifestData = await response.json();

                // Trigger direct file download to user's PC
                const cleanName = projectName.replace(/\s+/g, '_');
                const jsonBlob = new Blob([JSON.stringify(manifestData, null, 2)], { type: "application/json" });
                const downloadUrl = URL.createObjectURL(jsonBlob);
                
                const link = document.createElement("a");
                link.href = downloadUrl;
                link.download = `${cleanName}_manifest.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(downloadUrl);

                setStatus(`<strong>Milling Complete!</strong><br>Downloaded <code>${cleanName}_manifest.json</code> to your PC.`, "success");

            } catch (err) {
                console.error("Mill Error:", err);
                setStatus(`<strong>Milling Failed:</strong> ${err.message}`, "error");
            } finally {
                millBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
